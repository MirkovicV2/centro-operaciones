name: Ubuntu 26.10

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    container: ubuntu:26.10
    timeout-minutes: 12
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git python3
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pipeline and context contracts
        run: npm test
      - name: Start a clean local panel
        shell: bash
        run: |
          set -euo pipefail
          CENTRO_ORCA_AGENT=claude node panel/dashboard.mjs > "${RUNNER_TEMP}/centro-panel.log" 2>&1 &
          panel_pid=$!
          trap 'kill "$panel_pid" 2>/dev/null || true; cat "${RUNNER_TEMP}/centro-panel.log"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:4187/api/state > "${RUNNER_TEMP}/centro-state.json"
          node -e 'const s = require(process.argv[1]); if (s.jobs.length || s.settings.vaultPath) process.exit(1)' "${RUNNER_TEMP}/centro-state.json"
          curl --fail --silent http://127.0.0.1:4187/requests-view.js > /dev/null
